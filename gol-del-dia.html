<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adivina el gol · GOALDAY</title>
<meta name="description" content="Un gol cada día. Mira la jugada sin escudos ni marcador y adivina quién lo marcó.">
<meta name="theme-color" content="#06241a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800;900&family=Barlow:wght@400;600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{
  --night:#06241a;--glass:rgba(5,28,19,.82);--glass-2:rgba(255,255,255,.06);--glass-3:rgba(255,255,255,.11);
  --chalk:#f5f8f3;--chalk-2:rgba(245,248,243,.68);--chalk-3:rgba(245,248,243,.38);--line:rgba(245,248,243,.14);
  --gold:#f3c545;--gold-2:#ffe08a;--pass:#63e0a1;--fail:#ff6b5c;--btn:#f3c545;--btn-ink:#1b1a0f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#145c40 0,var(--night) 60%) fixed,var(--night);color:var(--chalk);font-family:Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{color:var(--chalk-2);text-decoration:none;font-weight:700;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--glass)}
.brand{font-family:"Barlow Condensed";font-weight:900;letter-spacing:.12em;font-size:18px}
h1{font-family:"Barlow Condensed";font-weight:900;font-size:clamp(38px,10vw,60px);line-height:.92;margin:18px 0 6px;text-transform:uppercase;text-align:center}
h1 em{font-style:normal;color:var(--gold)}
.sub{color:var(--chalk-2);text-align:center;margin:0 0 14px;font-weight:600}
.sub b{color:var(--gold-2)}
.stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.stage .ytwrap{position:absolute;inset:0;overflow:hidden;background:#000}
.stage .ytwrap iframe{position:absolute;top:-17%;left:-9%;width:118%;height:134%;border:0;pointer-events:none}
.stage.bn video,.stage.bn .ytwrap{filter:grayscale(1) contrast(1.12) brightness(1.05)}
.cover{position:absolute;background:#050d09;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed";font-weight:900;letter-spacing:.14em;font-size:clamp(9px,2.2vw,14px);color:rgba(245,248,243,.45)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;font-family:"Barlow Condensed";font-weight:900;color:var(--chalk);text-shadow:0 4px 24px rgba(0,0,0,.7)}
.overlay.dim{background:rgba(0,0,0,.45)}
.overlay .count{font-size:min(26vw,140px);animation:pop .9s ease-out}
.overlay .q{font-size:clamp(30px,8vw,54px);color:var(--gold);animation:pop .6s ease-out}
.overlay .msg{font-family:Barlow;font-weight:600;font-size:15px;max-width:420px;line-height:1.4;text-shadow:none;color:var(--chalk-2)}
.overlay .play{pointer-events:auto}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;background:var(--btn);color:var(--btn-ink);font-family:"Barlow Condensed";font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 10px 26px rgba(243,197,69,.22)}
.btn.ghost{background:var(--glass-2);color:var(--chalk);border:1px solid var(--line);box-shadow:none}
.btn.small{font-size:16px;padding:10px 14px;border-radius:12px}
.ctrl{display:flex;gap:8px;justify-content:flex-end;margin:10px 0 4px}
.hints{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.hint{border:1px dashed rgba(243,197,69,.5);background:rgba(243,197,69,.06);color:var(--gold-2);border-radius:12px;padding:10px 8px;font-weight:700;font-size:13px;text-align:center;min-height:54px}
.hint.open{border-style:solid;border-color:var(--line);background:var(--glass-2);color:var(--chalk);font-weight:600;cursor:default}
.hint:disabled:not(.open){opacity:.5;cursor:default}
.hint small{display:block;color:var(--chalk-3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
@media (max-width:480px){.hints{grid-template-columns:1fr}.hint{min-height:0}}
.guess{position:relative;display:flex;gap:8px}
.guess input{flex:1;min-width:0;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--chalk);padding:13px 14px;font:600 17px Barlow,sans-serif;outline:none}
.guess input:focus{border-color:var(--gold)}
.sug{position:absolute;left:0;right:0;bottom:calc(100% + 6px);z-index:5;background:#0a2e21;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.sug button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--chalk);padding:11px 14px;font-weight:600;font-size:16px}
.sug button+button{border-top:1px solid var(--line)}
.sug button.on,.sug button:hover{background:var(--glass-3)}
.tries{display:flex;gap:6px;align-items:center;margin:10px 0 0;font-size:14px;color:var(--chalk-2)}
.tries span{width:22px;height:6px;border-radius:3px;background:var(--glass-3)}
.tries span.x{background:var(--fail)}
.fb{min-height:22px;margin:8px 0 0;font-weight:700}
.fb.bad{color:var(--fail)}.fb.good{color:var(--pass)}
.guesses{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.guesses span{font-size:13px;padding:4px 10px;border-radius:999px;background:rgba(255,107,92,.15);color:#ffb1a8;text-decoration:line-through}
.reveal{margin-top:12px;border-radius:16px;padding:16px;background:linear-gradient(160deg,rgba(243,197,69,.18),rgba(5,28,19,.9) 70%);border:1px solid rgba(243,197,69,.45)}
.reveal .nm{font-family:"Barlow Condensed";font-weight:900;font-size:32px;text-transform:uppercase;line-height:1}
.reveal .mt{color:var(--chalk-2);margin:6px 0 10px;font-weight:600}
.reveal p{margin:0 0 12px;line-height:1.45;color:var(--chalk-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--glass-2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:"Barlow Condensed";font-size:28px;color:var(--gold)}
.stat span{font-size:12px;color:var(--chalk-2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--chalk-3);font-size:13px}
.test{background:#6b1d15;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;margin-top:12px;text-align:center}
[hidden]{display:none!important}
.emoji{font-family:"Noto Color Emoji",sans-serif}
</style>
<style>.gdlogo{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--chalk,#f5f8f3);font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:22px;letter-spacing:.12em}.gdlogo svg{width:34px;height:34px;flex:none}</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <a class="back" href="./">← Juegos</a>
    <a class="brand gdlogo" href="./" aria-label="GOALDAY"><svg width="34" height="34" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="gdhh4"><rect x="0" y="0" width="100" height="63"></rect></clipPath><clipPath id="gddh4"><circle cx="50" cy="60" r="31.5"></circle></clipPath></defs><g clip-path="url(#gdhh4)"><circle cx="50" cy="60" r="32" fill="#f5f8f3"></circle><g clip-path="url(#gddh4)"><polygon points="50.00,33.00 59.51,39.91 55.88,51.09 44.12,51.09 40.49,39.91" fill="#06241a"></polygon><path d="M50.00 33.00L50.00 26.00" stroke="#06241a" stroke-width="3" stroke-linecap="round"></path><polygon points="50.00,25.50 40.96,18.94 44.42,8.31 55.58,8.31 59.04,18.94" fill="#06241a"></polygon><path d="M59.51 39.91L66.17 37.75" stroke="#06241a" stroke-width="3" stroke-linecap="round"></path><polygon points="66.64,37.59 70.09,26.97 81.26,26.97 84.71,37.59 75.68,44.16" fill="#06241a"></polygon><path d="M55.88 51.09L59.99 56.75" stroke="#06241a" stroke-width="3" stroke-linecap="round"></path><polygon points="60.29,57.16 71.45,57.16 74.91,67.78 65.87,74.34 56.84,67.78" fill="#06241a"></polygon><path d="M44.12 51.09L40.01 56.75" stroke="#06241a" stroke-width="3" stroke-linecap="round"></path><polygon points="39.71,57.16 43.16,67.78 34.13,74.34 25.09,67.78 28.55,57.16" fill="#06241a"></polygon><path d="M40.49 39.91L33.83 37.75" stroke="#06241a" stroke-width="3" stroke-linecap="round"></path><polygon points="33.36,37.59 24.32,44.16 15.29,37.59 18.74,26.97 29.91,26.97" fill="#06241a"></polygon></g></g><path d="M9 72H91" stroke="#f5f8f3" stroke-width="7" stroke-linecap="round"></path></svg><span>GOALDAY</span></a>
  </div>
  <div class="test" id="testBar" hidden></div>
  <h1>Adivina <em>el gol</em></h1>
  <p class="sub" id="sub"></p>

  <div class="stage bn" id="stage">
    <video id="vid" muted playsinline preload="auto"></video>
    <div class="ytwrap" id="ytwrap" hidden><div id="ytp"></div></div>
    <div id="covers"></div>
    <div class="overlay dim" id="ov"></div>
  </div>
  <div class="ctrl">
    <button class="btn ghost small" id="bSlow">🐢 0,5×</button>
    <button class="btn ghost small" id="bReplay">⟲ Repetir</button>
  </div>

  <div class="hints" id="hints"></div>

  <div id="askBox">
    <div class="guess">
      <div class="sug" id="sug" hidden></div>
      <input id="inp" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="¿Quién marcó? Escribe un nombre…">
      <button class="btn small" id="bGo">OK</button>
    </div>
    <div class="tries" id="tries"></div>
    <div class="guesses" id="guesses"></div>
    <div class="fb" id="fb"></div>
    <p class="muted">Cada pista resta 25 puntos y cada fallo 10. Tienes 3 intentos. <button class="btn ghost small" id="bGive" style="margin-left:6px;font-size:13px;padding:6px 10px">Me rindo</button></p>
  </div>

  <div class="reveal" id="rev" hidden></div>
</main>

<script src="goles.js"></script>
<script>
const DLOC=(()=>{let l=null;try{l=localStorage.getItem('fg_lang')}catch(e){}if(!l){const b=((navigator.languages&&navigator.languages[0])||navigator.language||'').toLowerCase().slice(0,2);l=/^(es|ca|gl|eu)$/.test(b)?'es':'en'}return l==='en'?'en-US':'es-ES'})();
const NAMES=[...new Set(("Lionel Messi|Cristiano Ronaldo|Pelé|Robert Lewandowski|Zlatan Ibrahimović|Luis Suárez|Neymar|Kylian Mbappé|Erling Haaland|Harry Kane|Diego Maradona|Ronaldo Nazário|Zinedine Zidane|Raúl|Gerd Müller|Alfredo Di Stéfano|Ferenc Puskás|Eusébio|Sergio Ramos|Gabigol|Martín Palermo|Thierry Henry|Didier Drogba|Edinson Cavani|Mohamed Salah|Marco van Basten|Gabriel Batistuta|Ronaldinho|Andrés Iniesta|Ángel Di María|Romário|Geoff Hurst|Juan Román Riquelme|Karim Benzema|Wayne Rooney|Sergio Agüero|Gonzalo Higuaín|Antoine Griezmann|Francesco Totti|Alessandro Del Piero|Paolo Rossi|Michel Platini|Just Fontaine|Johan Cruyff|Thomas Müller|Miroslav Klose|Jürgen Klinsmann|Karl-Heinz Rummenigge|Bobby Charlton|Alan Shearer|Gary Lineker|Dennis Bergkamp|Christian Vieri|Hernán Crespo|Carlos Tévez|Radamel Falcao|Rivaldo|Kaká|Luka Modrić|Sadio Mané|Vinícius Júnior|Jude Bellingham|Lamine Yamal|Hugo Sánchez|Javier Hernández|Alexis Sánchez|Iván Zamorano|Fernando Torres|David Villa|Diego Forlán|Roger Milla|George Weah|Bebeto|Jairzinho|Garrincha|Zico|Mario Kempes|Olivier Giroud|Henrik Larsson|Carles Puyol|Paolo Maldini|Franz Beckenbauer|Cafú|Roberto Carlos|Xavi Hernández|Lothar Matthäus|Ruud Gullit|Sócrates|Julián Álvarez|Lautaro Martínez|Ferran Torres|Telmo Zarra|Jean-Pierre Papin|Raúl Tamudo|Ousmane Dembélé|Raphinha|Rodrygo|Paulo Dybala|Victor Osimhen|Alexander Isak|Darwin Núñez|Bukayo Saka|Marcus Rashford|Jamie Vardy|Michael Owen|Adriano|Álvaro Morata|Nico Williams|Julio Salinas|Emilio Butragueño|Iago Aspas|Fernando Morientes|Quini|Francisco Gento|Luis Enrique|Fernando Hierro|Gerard Piqué|Xabi Alonso|Rodri|Kevin De Bruyne|Eden Hazard|Romelu Lukaku|Toni Kroos|Michael Ballack|Lukas Podolski|Mario Götze|Rudi Völler|Andrea Pirlo|Roberto Baggio|Filippo Inzaghi|Ciro Immobile|Mario Balotelli|Marco Materazzi|Fabio Cannavaro|Steven Gerrard|Frank Lampard|David Beckham|Paul Scholes|Ryan Giggs|Gareth Bale|Ian Rush|Kenny Dalglish|Ole Gunnar Solskjær|Robbie Keane|Wesley Sneijder|Arjen Robben|Robin van Persie|Ruud van Nistelrooy|Patrick Kluivert|Virgil van Dijk|Luís Figo|Deco|Pauleta|Bruno Fernandes|Bernardo Silva|Diogo Jota|Franck Ribéry|Nicolas Anelka|David Trezeguet|Patrick Vieira|Emmanuel Petit|Paul Pogba|Andriy Shevchenko|Hristo Stoichkov|Davor Šuker|Mario Mandžukić|Ivan Perišić|Gheorghe Hagi|Edin Džeko|Ali Daei|Son Heung-min|Pierre-Emerick Aubameyang|Claudio Caniggia|Jorge Valdano|Diego Milito|Diego Simeone|Dani Alves|James Rodríguez|Carlos Valderrama|Luis Díaz|Cuauhtémoc Blanco|Christian Pulisic|Jimmy Greaves|David Silva|Cesc Fàbregas|Bastian Schweinsteiger|Mesut Özil|Mario Gómez|Marco Reus|Luca Toni|Enzo Fernández|Marcelo|Thiago Silva|Casemiro|Philippe Coutinho|Federico Valverde|Rafa Márquez|Landon Donovan|Christian Eriksen|Carlos Alberto|Benjamin Pavard|Dani Carvajal|Arnold Mühren|Robert Pires|André Schürrle|Lucas Hernández|Nani|Abel Aguilar|Héctor Enrique|Jorge Burruchaga|Samuel Eto'o|Tostão|Rivelino|Clodoaldo|Gerard Deulofeu|Rafael van der Vaart|Arjen Robben").split('|'))].sort((a,b)=>a.localeCompare(b,'es'));
const $=id=>document.getElementById(id);
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};

/* ---- qué gol toca hoy ---- */
const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const TODAY=keyOf(today);
const params=new URLSearchParams(location.search);
const TEST=params.has('dia');
let dayIdx=Math.round((today-parseKey(INICIO))/864e5);
if(TEST)dayIdx=Math.max(0,(+params.get('dia')||1)-1);
const NUM=dayIdx+1;
const GOL=dayIdx>=0?GOLES[dayIdx%GOLES.length]:null;
const SKEY='gd_gol_'+TODAY;

let st=TEST?null:store.get(SKEY);
if(!st)st={hints:0,miss:0,guesses:[],done:false,ok:false};
const save=()=>{if(!TEST)store.set(SKEY,st)};

/* ---- vídeo (mp4 del repo o YouTube) ---- */
const vid=$('vid'),stage=$('stage'),ov=$('ov');
const USE_YT=!!(GOL&&GOL.yt);
let stopAt=null,watch=0,countIv=0,yt=null,ytReady=false,ytPoll=0,ytRate=1,pendingPlay=null;
function setCovers(on){
  const C=$('covers');C.innerHTML='';if(!on)return;
  const boxes=GOL.tapar||(USE_YT?[]:[{x:0,y:0,w:34,h:13}]);
  for(const b of boxes){const d=document.createElement('div');d.className='cover';d.style.cssText=`left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%`;d.textContent='GOALDAY';C.appendChild(d)}
}
function askOverlay(){ov.className='overlay dim';ov.innerHTML='<span class="q">¿Quién marcó?</span>'}
/* --- YouTube --- */
function ytInit(){
  $('ytwrap').hidden=false;
  const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady=()=>{
    yt=new YT.Player('ytp',{videoId:GOL.yt,host:'https://www.youtube-nocookie.com',width:'100%',height:'100%',
      playerVars:{controls:0,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3,disablekb:1,fs:0,start:GOL.desde||0,mute:1},
      events:{
        onReady:()=>{ytReady=true;if(pendingPlay){const p=pendingPlay;pendingPlay=null;p()}},
        onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING){ytWatch()}else if(e.data===YT.PlayerState.ENDED){clearInterval(ytPoll)}},
        onError:()=>{clearInterval(countIv);ov.className='overlay dim';ov.innerHTML=`<span class="q" style="font-size:30px">Vídeo no disponible</span><span class="msg">Este vídeo de YouTube no permite insertarse en otras webs. Cambia el enlace de este gol en <b>goles.js</b>.</span>`}
      }});
  };
}
function ytWatch(){
  clearInterval(ytPoll);
  ytPoll=setInterval(()=>{
    if(!yt||!yt.getCurrentTime)return;
    const t=yt.getCurrentTime();
    if(stopAt!=null&&t>=stopAt){yt.pauseVideo();clearInterval(ytPoll);askOverlay();return}
    if(GOL.hasta&&t>=GOL.hasta){yt.pauseVideo();clearInterval(ytPoll)}
  },80);
}
function ytPlay(full){
  const go=()=>{yt.mute();yt.setPlaybackRate(ytRate);yt.seekTo(GOL.desde||0,true);yt.playVideo()};
  if(ytReady)go();else pendingPlay=go;
}
/* --- común --- */
function playClip(full,withCount){
  clearInterval(countIv);cancelAnimationFrame(watch);clearInterval(ytPoll);
  if(USE_YT){if(yt&&yt.pauseVideo)yt.pauseVideo()}else vid.pause();
  stage.classList.toggle('bn',!full&&!GOL.color);setCovers(!full);
  const go=()=>{
    ov.className='overlay';ov.innerHTML='';
    stopAt=full?null:GOL.corte;
    if(USE_YT){ytPlay(full);return}
    vid.controls=false;
    try{vid.currentTime=GOL.desde||0}catch(e){}
    const p=vid.play();if(p&&p.catch)p.catch(()=>{ov.className='overlay dim';ov.innerHTML='<button class="btn play" id="bPlay">▶ Ver jugada</button>';$('bPlay').onclick=()=>playClip(full,false)});
    const tick=()=>{
      if(stopAt!=null&&vid.currentTime>=stopAt){vid.pause();askOverlay();return}
      if(!vid.paused&&!vid.ended)watch=requestAnimationFrame(tick);
    };
    watch=requestAnimationFrame(tick);
  };
  if(withCount){
    let c=3;ov.className='overlay dim';ov.innerHTML=`<span class="count">${c}</span>`;
    countIv=setInterval(()=>{c--;if(c>0)ov.innerHTML=`<span class="count">${c}</span>`;else{clearInterval(countIv);go()}},650);
  }else go();
}
vid.addEventListener('play',()=>{cancelAnimationFrame(watch);const tick=()=>{if(stopAt!=null&&vid.currentTime>=stopAt){vid.pause();askOverlay();return}if(!vid.paused)watch=requestAnimationFrame(tick)};watch=requestAnimationFrame(tick)});
vid.addEventListener('error',()=>{
  if(USE_YT)return;
  clearInterval(countIv);ov.className='overlay dim';
  ov.innerHTML=`<span class="q" style="font-size:30px">Vídeo no disponible</span><span class="msg">No se encuentra <b>${GOL.video}</b>. Súbelo a la carpeta <b>goles</b> del repositorio o pon un enlace de YouTube en <b>goles.js</b>.</span>`;
});
$('bReplay').onclick=()=>playClip(st.done,false);
$('bSlow').onclick=()=>{
  if(USE_YT){ytRate=ytRate===1?.5:1;$('bSlow').textContent=ytRate===1?'🐢 0,5×':'⚡ 1×'}
  else{vid.playbackRate=vid.playbackRate===1?.5:1;$('bSlow').textContent=vid.playbackRate===1?'🐢 0,5×':'⚡ 1×'}
  playClip(st.done,false)};

/* ---- pistas e intentos ---- */
function points(){return st.ok?Math.max(0,100-25*st.hints-10*st.miss):0}
function renderHints(){
  const H=$('hints');H.innerHTML='';const tit=['Competición','Contexto','Nacionalidad'];
  GOL.h.forEach((txt,i)=>{
    const b=document.createElement('button');
    if(i<st.hints||st.done){b.className='hint open';b.innerHTML=`<small>${tit[i]}</small>${txt}`;b.disabled=true}
    else{b.className='hint';b.innerHTML=`<small>Pista ${i+1}</small>${tit[i]} · −25`;b.disabled=i!==st.hints;b.onclick=()=>{st.hints++;save();renderHints()}}
    H.appendChild(b);
  });
}
function renderTries(){
  $('tries').innerHTML='Intentos '+[0,1,2].map(i=>`<span class="${i<st.miss?'x':''}"></span>`).join('');
  $('guesses').innerHTML=st.guesses.map(g=>`<span>${g}</span>`).join('');
}

/* ---- autocompletar ---- */
let sel=-1,opts=[];
function suggest(){
  const q=norm($('inp').value);sel=-1;
  if(q.length<2){$('sug').hidden=true;return}
  opts=NAMES.filter(n=>{const m=norm(n);return m.split(' ').some(w=>w.startsWith(q))||m.startsWith(q)||(q.length>3&&m.includes(q))}).slice(0,6);
  if(!opts.length){$('sug').hidden=true;return}
  $('sug').innerHTML=opts.map((n,i)=>`<button type="button" data-i="${i}">${n}</button>`).join('');$('sug').hidden=false;
}
$('inp').addEventListener('input',suggest);
$('inp').addEventListener('keydown',e=>{
  const S=$('sug');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(S.hidden)return;e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length;[...S.children].forEach((b,i)=>b.classList.toggle('on',i===sel))}
  else if(e.key==='Enter'){e.preventDefault();if(!S.hidden&&sel>=0){$('inp').value=opts[sel];S.hidden=true}else if(!S.hidden&&opts.length===1){$('inp').value=opts[0];S.hidden=true}else submit()}
  else if(e.key==='Escape')S.hidden=true;
});
$('sug').addEventListener('mousedown',e=>e.preventDefault());
$('sug').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('inp').value=opts[+b.dataset.i];$('sug').hidden=true;submit()});
$('bGo').onclick=submit;
$('bGive').onclick=()=>finish(false);

function isRight(guess){
  const g=norm(guess),n=norm(GOL.name);if(!g)return false;if(g===n)return true;
  const al=(GOL.alias||[]).map(norm);if(al.includes(g))return true;
  const last=n.split(' ').slice(-1)[0];
  const alias={'cristiano ronaldo':['cristiano','cr7'],'lionel messi':['messi','leo messi'],'zlatan ibrahimovic':['zlatan','ibra'],'sergio aguero':['kun','kun aguero'],'james rodriguez':['james'],'zinedine zidane':['zizou']};
  if((alias[n]||[]).includes(g))return true;
  return g===last&&NAMES.filter(x=>norm(x).split(' ').slice(-1)[0]===last).length<=1;
}
function submit(){
  if(st.done)return;const v=$('inp').value.trim();if(!v)return;$('sug').hidden=true;
  if(isRight(v)){finish(true);return}
  st.miss++;st.guesses.push(v);save();renderTries();$('inp').value='';
  $('fb').className='fb bad';$('fb').textContent=`No es ${v}.`+(st.miss<3?' Prueba otra vez.':'');
  if(st.miss>=3)setTimeout(()=>finish(false),600);
}

/* ---- racha ---- */
function updateStreak(ok){
  if(TEST)return;
  const s=store.get('gd_gol_stats')||{played:0,won:0,streak:0,best:0,last:null};
  if(s.last===TODAY)return;
  const y=new Date(today);y.setDate(y.getDate()-1);
  s.played++;if(ok){s.won++;s.streak=(s.last===keyOf(y)&&s.lastOk)?s.streak+1:1;s.best=Math.max(s.best,s.streak)}else s.streak=0;
  s.last=TODAY;s.lastOk=ok;store.set('gd_gol_stats',s);
}
function finish(ok){
  if(st.done)return;st.done=true;st.ok=ok;save();updateStreak(ok);showResult(true);
}
function shareText(){
  const row=[...Array(st.miss)].map(()=>'🟥').join('')+(st.ok?'🟩':'');
  const s=store.get('gd_gol_stats');
  return `GOALDAY ⚽ Adivina el gol #${NUM}\n${row||'🟥🟥🟥'}${st.hints?'  💡'+st.hints:''}\n${st.ok?points()+' puntos':'No lo he sacado'}${s&&s.streak>1?'  🔥 racha '+s.streak:''}\n${location.origin+location.pathname}`;
}
let cdIv=0;
function showResult(play){
  $('askBox').hidden=true;renderHints();
  const s=store.get('gd_gol_stats')||{played:0,won:0,streak:0,best:0};
  $('rev').innerHTML=`<div class="fb ${st.ok?'good':'bad'}" style="margin:0 0 8px">${st.ok?`¡Correcto! ${points()} puntos`:'¡Vaya! Era…'}</div>
    <div class="nm"><span class="emoji">${GOL.flag}</span> ${GOL.name}</div>
    <div class="mt">${GOL.mt}</div><p>${GOL.tx}</p>
    ${TEST?'':`<div class="stats"><div class="stat"><b>${s.played}</b><span>Jugados</span></div><div class="stat"><b>${s.streak}</b><span>Racha 🔥</span></div><div class="stat"><b>${s.best}</b><span>Mejor racha</span></div></div>`}
    <div class="row"><button class="btn" id="bShare">Compartir</button><span class="muted" id="shareOk"></span></div>
    <p class="muted" style="margin:12px 0 0">Siguiente gol en <b id="cd" style="color:var(--gold-2)"></b></p>`;
  $('rev').hidden=false;
  $('bShare').onclick=async()=>{const t=shareText();try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);$('shareOk').textContent='Copiado ✔'}}catch(e){}};
  const tick=()=>{const t=new Date(today);t.setDate(t.getDate()+1);let ms=t-new Date();if(ms<0)ms=0;const h=ms/36e5|0,m=ms/6e4%60|0,x=ms/1e3%60|0;$('cd').textContent=`${pad(h)}:${pad(m)}:${pad(x)}`};
  tick();clearInterval(cdIv);cdIv=setInterval(tick,1000);
  if(play)playClip(true,false);else{stage.classList.remove('bn');setCovers(false);ov.className='overlay dim';ov.innerHTML='<button class="btn play" id="bPlay">▶ Ver el gol</button>';$('bPlay').onclick=()=>playClip(true,false)}
}

/* ---- arranque ---- */
if(!GOL){
  $('sub').textContent='';
  ov.innerHTML=`<span class="q" style="font-size:32px">Próximamente</span>`;
  $('askBox').hidden=true;document.querySelector('.ctrl').hidden=true;
}else{
  $('sub').innerHTML=`#${NUM} · ${today.toLocaleDateString(DLOC,{weekday:'long',day:'numeric',month:'long'})}`;
  if(TEST){$('testBar').hidden=false;$('testBar').textContent=`MODO PRUEBA · gol ${NUM} de ${GOLES.length} (${GOL.yt?'YouTube '+GOL.yt:GOL.video}) · no se guarda nada`}
  if(USE_YT){vid.hidden=true;ytInit()}else vid.src=GOL.video;
  renderHints();renderTries();
  if(st.done)showResult(false);
  else{ov.innerHTML='<button class="btn play" id="bPlay">▶ Ver la jugada</button><span class="msg" style="margin-top:12px">Sin escudos, sin colores, sin marcador. Solo la jugada.</span>';$('bPlay').onclick=()=>playClip(false,true)}
}
</script>
