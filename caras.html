<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Revisar caras · GOALDAY</title>
<style>
body{margin:0;background:#06241a;color:#f5f8f3;font-family:system-ui,sans-serif}
.top{position:sticky;top:0;z-index:2;background:#041a12;padding:12px 16px;border-bottom:1px solid #1f2e26;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.top b{font-size:18px}.top span{color:#9fb3a8;font-size:14px;flex:1}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 14px;background:#f3c545;color:#1b1a0f;cursor:pointer}
button.g{background:#1f2e26;color:#f5f8f3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:16px}
.c{background:#0b1a13;border:2px solid #1f2e26;border-radius:12px;padding:10px;text-align:center;cursor:pointer;user-select:none}
.c .ph{width:90px;height:90px;margin:0 auto 6px;border-radius:50%;overflow:hidden;background:#1f2e26;display:flex;align-items:center;justify-content:center;color:#6b7f74;font-size:12px}
.c img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.c .n{font-size:13px;font-weight:700;line-height:1.2}
.c.bad{border-color:#ff5a4e;background:#2a0f0c}.c.bad .n::after{content:" ✗";color:#ff5a4e}
.c.none{border-style:dashed}
#out{display:none;width:calc(100% - 32px);margin:0 16px 20px;height:120px}
</style></head><body>
<div class="top"><b>Revisar caras</b><span id="st">Cargando fotos…</span>
<button class="g" id="bOnly">Ver solo sin foto / mal</button><button id="bCopy">Copiar resultado para Claude</button></div>
<textarea id="out" readonly></textarea>
<div class="grid" id="grid"></div>
<script src="players.js"></script><script src="faces.js"></script>
<script>
const names=GD_PLAYERS.map(p=>p.name),bad=new Set();let faces={},only=false;
function draw(){
  document.getElementById('grid').innerHTML=names.map(n=>{const u=faces[n];const cls=(bad.has(n)?' bad':'')+(u?'':' none');
    if(only&&u&&!bad.has(n))return'';
    return `<div class="c${cls}" data-n="${n.replace(/"/g,'&quot;')}"><div class="ph">${u?`<img src="${u}" loading="lazy" alt="">`:'sin foto'}</div><div class="n">${n}</div></div>`}).join('');
  const sin=names.filter(n=>!faces[n]).length;
  document.getElementById('st').textContent=`${names.length} jugadores · ${sin} sin foto · ${bad.size} marcadas mal. Toca una cara si NO es ese jugador (o la foto es mala).`;
}
document.getElementById('grid').onclick=e=>{const c=e.target.closest('.c');if(!c)return;const n=c.dataset.n;bad.has(n)?bad.delete(n):bad.add(n);draw()};
document.getElementById('bOnly').onclick=e=>{only=!only;e.target.textContent=only?'Ver todas':'Ver solo sin foto / mal';draw()};
document.getElementById('bCopy').onclick=async()=>{
  const ok={};names.forEach(n=>{if(faces[n]&&!bad.has(n))ok[n]=faces[n]});
  const txt='CARAS GOALDAY\nMAL: '+[...bad].join(', ')+'\nSIN FOTO: '+names.filter(n=>!faces[n]).join(', ')+'\nOK: '+JSON.stringify(ok);
  const o=document.getElementById('out');o.value=txt;o.style.display='block';o.select();
  try{await navigator.clipboard.writeText(txt);document.getElementById('bCopy').textContent='Copiado ✔'}catch(e){document.execCommand('copy')}
};
GD_faces_reset();
GD_faces(names).then(m=>{faces=m;draw()});
</script></body></html>
