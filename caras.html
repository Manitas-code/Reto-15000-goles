<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Revisar caras · GOALDAY</title>
<style>
body{margin:0;background:#06241a;color:#f5f8f3;font-family:system-ui,sans-serif}
.top{position:sticky;top:0;z-index:2;background:#041a12;padding:12px 16px;border-bottom:1px solid #1f2e26;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.top b{font-size:18px}.top span{color:#9fb3a8;font-size:14px;flex:1;min-width:220px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 14px;background:#f3c545;color:#1b1a0f;cursor:pointer}
button.g{background:#1f2e26;color:#f5f8f3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:16px}
.c{background:#0b1a13;border:2px solid #1f2e26;border-radius:12px;padding:10px;text-align:center;cursor:pointer;user-select:none}
.ph{width:90px;height:90px;margin:0 auto 6px;border-radius:50%;overflow:hidden;background:#1f2e26;display:flex;align-items:center;justify-content:center;color:#6b7f74;font-size:12px}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.c .n{font-size:13px;font-weight:700;line-height:1.2}
.c.chg{border-color:#39d98a}.c.chg .n::after{content:" ✓";color:#39d98a}
.c.none{border-style:dashed}
#out{display:none;width:calc(100% - 32px);margin:0 16px 20px;height:120px}
.modal{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.8);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px}
.box{background:#0b1a13;border:1px solid #1f2e26;border-radius:16px;max-width:900px;width:100%;padding:16px}
.box h2{margin:0 0 4px}.box p{margin:0 0 12px;color:#9fb3a8;font-size:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.opt{border:2px solid #1f2e26;border-radius:12px;overflow:hidden;cursor:pointer;background:#050c08;position:relative}
.opt img{width:100%;height:170px;object-fit:cover;object-position:50% 20%;display:block}
.opt small{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:6px;font-size:11px}
.opt.cur{border-color:#f3c545}
.opt:hover{border-color:#39d98a}
.row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
</style></head><body>
<div class="top"><b>Revisar caras</b><span id="st">Cargando fotos…</span>
<button class="g" id="bOnly">Ver solo cambiadas / sin foto</button><button id="bCopy">Copiar resultado para Claude</button></div>
<textarea id="out" readonly></textarea>
<div class="grid" id="grid"></div>
<div class="modal" id="modal" hidden></div>
<script src="players.js"></script><script src="faces.js"></script>
<script>
const names=GD_PLAYERS.map(p=>p.name);let faces={},only=false;
const CKEY='gd_caras_elegidas';let chosen={};try{chosen=JSON.parse(localStorage.getItem(CKEY))||{}}catch(e){}
const saveC=()=>{try{localStorage.setItem(CKEY,JSON.stringify(chosen))}catch(e){}};
const cur=n=>(n in chosen)?chosen[n]:faces[n];
const esc=s=>s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function draw(){
  document.getElementById('grid').innerHTML=names.map(n=>{const u=cur(n);if(only&&!(n in chosen)&&u)return'';
    return `<div class="c${n in chosen?' chg':''}${u?'':' none'}" data-n="${esc(n)}"><div class="ph">${u?`<img src="${u}" loading="lazy" alt="">`:'sin foto'}</div><div class="n">${esc(n)}</div></div>`}).join('');
  document.getElementById('st').textContent=`${Object.keys(chosen).length} cambiadas · ${names.filter(n=>!cur(n)).length} sin foto. Toca un jugador para elegir otra foto (por ejemplo, una de cuando jugaba).`;
}
// ---- buscar fotos alternativas: imágenes de sus artículos (es/en) + Wikimedia Commons ----
const BAD=/flag|bandera|logo|escudo|crest|icon|kit|badge|map|mapa|signature|firma|trophy|trofeo|stadium|estadio|\.svg|commons-|wikiquote|wiktionary|question_book|disambig|edit-clear|ambox|medal|medalla/i;
async function imgs(host,params){
  try{const d=await (await fetch(`https://${host}/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url|mime&iiurlwidth=400&`+params)).json();
    return Object.values((d.query&&d.query.pages)||{}).filter(p=>p.imageinfo&&/jpeg|png/.test(p.imageinfo[0].mime)&&!BAD.test(p.title)).map(p=>({t:p.title.replace(/^(File|Archivo):/,''),u:p.imageinfo[0].thumburl}));
  }catch(e){return []}
}
async function candidates(n){
  const t=encodeURIComponent(n);
  const lists=await Promise.all([
    imgs('es.wikipedia.org','redirects=1&generator=images&gimlimit=50&titles='+t),
    imgs('en.wikipedia.org','redirects=1&generator=images&gimlimit=50&titles='+t),
    imgs('commons.wikimedia.org','generator=search&gsrnamespace=6&gsrlimit=40&gsrsearch='+encodeURIComponent('"'+n+'"')),
  ]);
  const seen=new Set(),all=[];lists.flat().forEach(x=>{if(x.u&&!seen.has(x.t)){seen.add(x.t);all.push(x)}});
  const yr=x=>{const m=x.t.match(/(19[3-9]\d|20[01]\d|202\d)/);return m?+m[1]:9999};
  return all.sort((a,b)=>yr(a)-yr(b)); // las más antiguas primero
}
async function openPick(n){
  const m=document.getElementById('modal');m.hidden=false;
  m.innerHTML=`<div class="box"><h2>${esc(n)}</h2><p>Buscando fotos…</p></div>`;
  const list=await candidates(n);const now=cur(n);
  m.innerHTML=`<div class="box"><h2>${esc(n)}</h2><p>Toca la foto que quieras. Las que tienen año salen primero, de más antigua a más nueva.</p>
   <div class="row"><button class="g" id="mClose">Cerrar</button>${n in chosen?'<button class="g" id="mUndo">Volver a la original</button>':''}<button class="g" id="mNone">Sin foto (iniciales)</button></div>
   <div class="opts">${list.map((x,i)=>`<div class="opt${x.u===now?' cur':''}" data-i="${i}"><img src="${x.u}" loading="lazy" alt=""><small>${esc((x.t.match(/(19|20)\d\d/)||[''])[0])}</small></div>`).join('')||'<p>No se han encontrado más fotos.</p>'}</div></div>`;
  m.querySelector('#mClose').onclick=()=>{m.hidden=true};
  const u=m.querySelector('#mUndo');if(u)u.onclick=()=>{delete chosen[n];saveC();m.hidden=true;draw()};
  m.querySelector('#mNone').onclick=()=>{chosen[n]='';saveC();m.hidden=true;draw()};
  m.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{chosen[n]=list[+o.dataset.i].u;saveC();m.hidden=true;draw()});
}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.target.hidden=true};
document.getElementById('grid').onclick=e=>{const c=e.target.closest('.c');if(c)openPick(c.dataset.n)};
document.getElementById('bOnly').onclick=e=>{only=!only;e.target.textContent=only?'Ver todas':'Ver solo cambiadas / sin foto';draw()};
document.getElementById('bCopy').onclick=async()=>{
  const all={};names.forEach(n=>{all[n]=cur(n)||''});
  const txt='CARAS GOALDAY\nCAMBIADAS: '+Object.keys(chosen).join(', ')+'\nFOTOS: '+JSON.stringify(all);
  const o=document.getElementById('out');o.value=txt;o.style.display='block';o.select();
  try{await navigator.clipboard.writeText(txt);document.getElementById('bCopy').textContent='Copiado ✔'}catch(e){document.execCommand('copy')}
};
GD_faces(names).then(m=>{faces=m;draw()});
</script></body></html>
