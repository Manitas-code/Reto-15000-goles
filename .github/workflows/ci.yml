name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run smoke:server
      - run: VITE_BASE_PATH=/Reto-15000-goles/ npm run build:web
      - run: WEB_BASE_PATH=/Reto-15000-goles/ npm run smoke:server
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
