name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # Only the original SVG byte-for-byte fixture needs V8/Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run build
      - run: bun run smoke:server
      - run: VITE_BASE_PATH=/Reto-15000-goles/ bun run build:web
      - run: WEB_BASE_PATH=/Reto-15000-goles/ bun run smoke:server
      - run: bunx --bun playwright install --with-deps chromium
      - run: bun run e2e
      - run: docker build --target production --tag goalday:ci .
      - run: docker run --rm --volume "$PWD/scripts/smoke-server.mjs:/app/scripts/smoke-server.mjs:ro" goalday:ci bun scripts/smoke-server.mjs
