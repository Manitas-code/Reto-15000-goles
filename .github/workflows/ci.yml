name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # Only the original SVG byte-for-byte fixture needs V8/Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bunx --bun playwright install --with-deps chromium
      - run: make verify
      - run: VITE_BASE_PATH=/Reto-15000-goles/ bun run build:web
      - run: WEB_BASE_PATH=/Reto-15000-goles/ bun run smoke:server
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
