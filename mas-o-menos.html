<title>Higher or Lower · GOALDAY</title>
<meta name="description" content="Dos futbolistas. ¿Quién tiene más goles? Aguanta la racha.">
<style>
:root{
  --night:#06241a;--glass:rgba(5,28,19,.82);--glass-2:rgba(255,255,255,.06);--glass-3:rgba(255,255,255,.11);
  --chalk:#f5f8f3;--chalk-2:rgba(245,248,243,.68);--chalk-3:rgba(245,248,243,.38);--line:rgba(245,248,243,.14);
  --gold:#f3c545;--gold-2:#ffe08a;--pass:#63e0a1;--fail:#ff6b5c;--btn:#f3c545;--btn-ink:#1b1a0f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#145c40 0,var(--night) 60%) fixed,var(--night);color:var(--chalk);font-family:Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{color:var(--chalk-2);text-decoration:none;font-weight:700;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--glass)}
.brand{font-family:"Barlow Condensed";font-weight:900;letter-spacing:.12em;font-size:18px}
h1{font-family:"Barlow Condensed";font-weight:900;font-size:clamp(38px,10vw,60px);line-height:.92;margin:18px 0 6px;text-transform:uppercase;text-align:center}
h1 em{font-style:normal;color:var(--gold)}
.sub{color:var(--chalk-2);text-align:center;margin:0 0 14px;font-weight:600}
.sub b{color:var(--gold-2)}
.stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.stage.bn video{filter:grayscale(1) contrast(1.12) brightness(1.05)}
.cover{position:absolute;background:#050d09;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed";font-weight:900;letter-spacing:.14em;font-size:clamp(9px,2.2vw,14px);color:rgba(245,248,243,.45)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;font-family:"Barlow Condensed";font-weight:900;color:var(--chalk);text-shadow:0 4px 24px rgba(0,0,0,.7)}
.overlay.dim{background:rgba(0,0,0,.45)}
.overlay .count{font-size:min(26vw,140px);animation:pop .9s ease-out}
.overlay .q{font-size:clamp(30px,8vw,54px);color:var(--gold);animation:pop .6s ease-out}
.overlay .msg{font-family:Barlow;font-weight:600;font-size:15px;max-width:420px;line-height:1.4;text-shadow:none;color:var(--chalk-2)}
.overlay .play{pointer-events:auto}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;background:var(--btn);color:var(--btn-ink);font-family:"Barlow Condensed";font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 10px 26px rgba(243,197,69,.22)}
.btn.ghost{background:var(--glass-2);color:var(--chalk);border:1px solid var(--line);box-shadow:none}
.btn.small{font-size:16px;padding:10px 14px;border-radius:12px}
.ctrl{display:flex;gap:8px;justify-content:flex-end;margin:10px 0 4px}
.hints{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.hint{border:1px dashed rgba(243,197,69,.5);background:rgba(243,197,69,.06);color:var(--gold-2);border-radius:12px;padding:10px 8px;font-weight:700;font-size:13px;text-align:center;min-height:54px}
.hint.open{border-style:solid;border-color:var(--line);background:var(--glass-2);color:var(--chalk);font-weight:600;cursor:default}
.hint:disabled:not(.open){opacity:.5;cursor:default}
.hint small{display:block;color:var(--chalk-3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
@media (max-width:480px){.hints{grid-template-columns:1fr}.hint{min-height:0}}
.guess{position:relative;display:flex;gap:8px}
.guess input{flex:1;min-width:0;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--chalk);padding:13px 14px;font:600 17px Barlow,sans-serif;outline:none}
.guess input:focus{border-color:var(--gold)}
.sug{position:absolute;left:0;right:0;bottom:calc(100% + 6px);z-index:5;background:#0a2e21;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.sug button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--chalk);padding:11px 14px;font-weight:600;font-size:16px}
.sug button+button{border-top:1px solid var(--line)}
.sug button.on,.sug button:hover{background:var(--glass-3)}
.tries{display:flex;gap:6px;align-items:center;margin:10px 0 0;font-size:14px;color:var(--chalk-2)}
.tries span{width:22px;height:6px;border-radius:3px;background:var(--glass-3)}
.tries span.x{background:var(--fail)}
.fb{min-height:22px;margin:8px 0 0;font-weight:700}
.fb.bad{color:var(--fail)}.fb.good{color:var(--pass)}
.guesses{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.guesses span{font-size:13px;padding:4px 10px;border-radius:999px;background:rgba(255,107,92,.15);color:#ffb1a8;text-decoration:line-through}
.reveal{margin-top:12px;border-radius:16px;padding:16px;background:linear-gradient(160deg,rgba(243,197,69,.18),rgba(5,28,19,.9) 70%);border:1px solid rgba(243,197,69,.45)}
.reveal .nm{font-family:"Barlow Condensed";font-weight:900;font-size:32px;text-transform:uppercase;line-height:1}
.reveal .mt{color:var(--chalk-2);margin:6px 0 10px;font-weight:600}
.reveal p{margin:0 0 12px;line-height:1.45;color:var(--chalk-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--glass-2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:"Barlow Condensed";font-size:28px;color:var(--gold)}
.stat span{font-size:12px;color:var(--chalk-2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--chalk-3);font-size:13px}
.test{background:#6b1d15;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;margin-top:12px;text-align:center}
[hidden]{display:none!important}
.emoji{font-family:"Noto Color Emoji",sans-serif}
</style><style>
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mode{border:1px solid var(--line);background:var(--glass);border-radius:16px;padding:16px;text-align:left;color:var(--chalk)}
.mode b{display:block;font-family:"Barlow Condensed";font-size:24px;text-transform:uppercase;line-height:1}
.mode span{display:block;color:var(--chalk-2);font-size:13px;margin-top:6px;line-height:1.35}
.mode.gold{border-color:rgba(243,197,69,.5);background:linear-gradient(160deg,rgba(243,197,69,.2),rgba(5,28,19,.9) 70%)}
.mode:disabled{opacity:.55;cursor:default}
.bar{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-weight:700;color:var(--chalk-2)}
.bar b{color:var(--gold);font-family:"Barlow Condensed";font-size:26px}
.cat{text-align:center;margin:6px 0 10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-2);font-size:13px}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.card{border-radius:16px;border:1px solid var(--line);background:var(--glass);padding:16px 10px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.card .fl{font-size:34px;line-height:1}
.card .nm{font-family:"Barlow Condensed";font-weight:900;font-size:clamp(18px,4.6vw,26px);text-transform:uppercase;line-height:1}
.card .pos{font-size:12px;color:var(--chalk-3);text-transform:uppercase;letter-spacing:.06em}
.card .val{font-family:"Barlow Condensed";font-weight:900;font-size:44px;color:var(--gold);line-height:1;margin-top:4px}

.vs{align-self:center;font-family:"Barlow Condensed";font-weight:900;color:var(--chalk-3);font-size:20px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.choice .btn{font-size:24px;padding:18px}
.choice .btn.less{background:var(--glass-3);color:var(--chalk);box-shadow:none;border:1px solid var(--line)}
.card.ok{border-color:var(--pass);box-shadow:0 0 0 2px rgba(99,224,161,.35)}
.card.ko{border-color:var(--fail);box-shadow:0 0 0 2px rgba(255,107,92,.35)}
.hand{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-height:44px}
.chip{border-radius:12px;background:var(--glass-2);border:1px solid var(--line);padding:8px 12px;font-weight:700;font-size:14px}
.chip b{color:var(--gold);margin-left:6px}
.total{display:flex;justify-content:space-between;align-items:flex-end;border-radius:16px;padding:14px 16px;background:var(--glass);border:1px solid var(--line);margin:10px 0}
.total div{text-align:center}
.total small{display:block;color:var(--chalk-3);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.total b{font-family:"Barlow Condensed";font-weight:900;font-size:40px;line-height:1}
.total .t b{color:var(--gold)}
.total .s b{color:var(--chalk)}
.total .s b.bust{color:var(--fail)}
.next{border-radius:16px;border:1px dashed rgba(243,197,69,.5);background:rgba(243,197,69,.06);padding:16px;text-align:center;margin:10px 0}
.next .nm{font-family:"Barlow Condensed";font-weight:900;font-size:30px;text-transform:uppercase;line-height:1}
.next .pos{font-size:12px;color:var(--chalk-3);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.acts .btn{font-size:17px;padding:14px 8px}
.acts .btn.ghost{color:var(--chalk)}
.res{margin-top:12px;border-radius:16px;padding:16px;background:linear-gradient(160deg,rgba(243,197,69,.18),rgba(5,28,19,.9) 70%);border:1px solid rgba(243,197,69,.45);text-align:center}

.center{text-align:center}
@media (max-width:420px){.duel{grid-template-columns:1fr 1fr;gap:8px}.vs{display:none}}
</style><style>
/* ===== Marcador LED (pantalla de juego) ===== */

body.playing h1,body.playing .sub{display:none}
.board{margin-top:14px;border-radius:18px;background-color:var(--board);
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1.3px);background-size:6px 6px;
  border:2px solid var(--frame);box-shadow:inset 0 0 0 6px #030805,inset 0 0 0 7px var(--frame),0 20px 50px rgba(0,0,0,.5);overflow:hidden}

.duel2{display:grid;grid-template-rows:1fr auto 1fr}

.side .nm{font-family:"Barlow Condensed";font-weight:900;font-size:clamp(26px,7vw,40px);line-height:.95;text-transform:uppercase;color:var(--chalk);max-width:14ch}

.choice2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px;margin-top:16px}
.choice2 button{border:0;border-radius:12px;padding:16px 8px;font-family:"Barlow Condensed";font-weight:900;font-size:24px;letter-spacing:.03em;color:#04120a}
.choice2 .up{background:var(--up);box-shadow:0 0 22px rgba(57,217,138,.3)}
.choice2 .down{background:var(--down);color:#1d0503;box-shadow:0 0 22px rgba(255,90,78,.3)}

.choice2 button:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.choice2[hidden]{display:grid!important;visibility:hidden}
.side.ok{background:rgba(57,217,138,.12)}

.fb2{min-height:24px;text-align:center;padding:10px 16px 14px;font-weight:700;color:var(--chalk-2)}
.fb2.bad{color:#ff9d94}
/* entrada: el de la derecha/abajo sube al sitio del primero y entra uno nuevo */
.side.inA{animation:inA .45s cubic-bezier(.2,.8,.2,1)}

<body>
<main class="wrap">
  <div class="top"><a class="back" href="./">← Juegos</a><a class="brand gdlogo" href="./" aria-label="GOALDAY"><svg width="34" height="34" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="gdhh4"><rect x="0" y="0" width="100" height="63"></rect></clipPath><clipPath id="gddh4"><circle cx="50" cy="60" r="31.5"></circle></clipPath></defs><g clip-path="url(#gdhh4)"><circle cx="50" cy="60" r="32" fill="#f5f8f3"></circle><g clip-path="url(#gddh4)"><polygon points="50.00,33.00 59.51,39.91 55.88,51.09 44.12,51.09 40.49,39.91" fill="#06241a"></polygon><path d="M50.00 33.00L50.00 26.00" stroke="#06241a" stroke-width="3" stroke-linecap="round"></path><polygon points="50.00,25.50 40.96,18.94 44.42,8.31 55.58,8.31 59.04,18.94" fill="#06241a"></polygon><path d="M59.51 39.91L66.17 37.75" stroke="#06241a" stroke-width="3" stroke-linecap="round"></path><polygon points="66.64,37.59 70.09,26.97 81.26,26.97 84.71,37.59 75.68,44.16" fill="#06241a"></polygon><path d="M55.88 51.09L59.99 56.75" stroke="#06241a" stroke-width="3" stroke-linecap="round"></path><polygon points="60.29,57.16 71.45,57.16 74.91,67.78 65.87,74.34 56.84,67.78" fill="#06241a"></polygon><path d="M44.12 51.09L40.01 56.75" stroke="#06241a" stroke-width="3" stroke-linecap="round"></path><polygon points="39.71,57.16 43.16,67.78 34.13,74.34 25.09,67.78 28.55,57.16" fill="#06241a"></polygon><path d="M40.49 39.91L33.83 37.75" stroke="#06241a" stroke-width="3" stroke-linecap="round"></path><polygon points="33.36,37.59 24.32,44.16 15.29,37.59 18.74,26.97 29.91,26.97" fill="#06241a"></polygon></g></g><path d="M9 72H91" stroke="#f5f8f3" stroke-width="7" stroke-linecap="round"></path></svg><span>GOALDAY</span></a></div>
  <h1>Higher or <em>Lower</em></h1>
  <p class="sub" id="sub">Sale un jugador con sus goles. ¿El siguiente tiene más o menos?<br>Tienes <b>10 segundos</b> para cada respuesta.</p>

  <div id="home">
    <div class="modes" id="modesBox"></div>
    <div class="stats" id="homeStats"></div>
    <div class="rank" id="rankBox"><h3>🌍 Ranking mundial</h3><div class="rtabs" id="rTabs"></div><div id="rankList"></div></div>
  </div>

  <div id="game" hidden>
    <div class="board">
      <div class="strip"><span class="ct" id="cat"></span><span>Racha<b id="streak">0</b></span><span>Récord<b id="rec">0</b></span><i class="tbar" id="tBar"></i></div>
      <div class="duel2">
        <section class="side" id="cA"><div class="nm"></div><div class="pos"><span class="flag emoji"></span> <span class="pn"></span></div><div class="led"></div><div class="unit">goles</div><div class="foot"></div></section>
        <div class="mid"><span id="tSec">VS</span></div>
        <section class="side" id="cB"><div class="nm"></div><div class="pos"><span class="flag emoji"></span> <span class="pn"></span></div><div class="led q">???</div><div class="unit">goles</div>
          <div class="foot"><div class="choice2" id="choice"><button class="up" id="bMore">▲ Más</button><button class="down" id="bLess">▼ Menos</button></div></div>

</main>

<script src="players.js"></script>

<script>

const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');
function dayKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
// El día va por la hora de Madrid: mismo reto diario y mismo ranking para todo el mundo
function madridDay(){const now=new Date();try{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now),g=t=>+p.find(x=>x.type===t).value;return new Date(g('year'),g('month')-1,g('day'))}catch(e){return new Date(now.getFullYear(),now.getMonth(),now.getDate())}}
const today=madridDay(),TODAY=dayKey(today);
function seeded(seedStr){let h=1779033703^seedStr.length;for(let i=0;i<seedStr.length;i++){h=Math.imul(h^seedStr.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
const fmt=n=>n.toLocaleString('es-ES');
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const POS_NAME={DEF:'Defensa',MED:'Centrocampista',DEL:'Delantero'};
const P=window.GD_PLAYERS.concat(window.GD_MM_EXTRA||[]);
async function share(t,el){try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);if(el)el.textContent='Copiado ✔'}}catch(e){}}
function countUp(el,to,ms){const t0=performance.now();const f=()=>{const p=Math.min(1,(performance.now()-t0)/ms);el.textContent=fmt(Math.round(to*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(f)};f();}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200);}

const CATS=[
 {k:'carrera',t:'Goles en toda su carrera',n:'Carrera',d:'Goles totales en toda su carrera',min:0},
 {k:'seleccion',t:'Goles con su selección',n:'Selección',d:'Goles con su selección nacional',min:1}
];
// Elige el rival B para el jugador A (misma categoría toda la partida).
// Dificultad progresiva según la racha:
//   0-4 aciertos  -> solo jugadores famosos (los 200 del Reto) y diferencias grandes (40 %+)
//   5-14          -> entran todos, diferencias medias (20-60 %)
//   15 o más      -> duelos ajustados (10-55 %)
// Nunca menos de un 10 % de diferencia (nada de 148 contra 150).
// rnd: Math.random en las partidas libres; en el reto diario, el generador con semilla del día
// (la racha también es igual para todos mientras aciertan, así que la cadena es la misma).
const FAMOUS=new Set((window.GD_PLAYERS||[]).map(p=>p.name));
function tier(){return streak<5?[0.40,0.85]:streak<15?[0.20,0.60]:[0.10,0.55]}
const diff=(x,y)=>Math.abs(x-y)/Math.max(x,y);
function pickB(a,pool,used,rnd){
  let base=pool.filter(p=>p!==a&&!used.has(p.name)&&p[cat.k]!==a[cat.k]);
  if(streak<5){const f=base.filter(p=>FAMOUS.has(p.name));if(f.length)base=f}
  const [lo,hi]=tier();
  const tries=[[lo,hi],[0.10,Math.max(hi,0.85)],[0.10,1]];
  for(const [l,h] of tries){
    const list=base.filter(p=>{const d=diff(a[cat.k],p[cat.k]);return d>=l&&d<=h});
    if(list.length)return list[Math.floor(rnd()*list.length)];
  }
  return base.length?base[Math.floor(rnd()*base.length)]:null;
}
let mode=null,cat=null,pool=[],used=new Set(),A=null,B=null,streak=0,round=0,results=[],busy=false,rnd=Math.random,flowT=0;
const SKEY='gd_mm_stats',DKEY='gd_mm_daily',LIMIT=10000;
function stats(){const s=store.get(SKEY)||{};s.best=s.best||0;s.games=s.games||0;s.total=s.total||0;s.bestByCat=s.bestByCat||{};s.sent=s.sent||{};return s}
// Reto diario: {'2026-09-25':{start:1,done:1,streak:7,sent:1}}. Empezar ya cuenta como jugado.
const daily=()=>store.get(DKEY)||{};
function setDaily(d,o){const all=daily();all[d]=Object.assign(all[d]||{},o);const ks=Object.keys(all).sort();while(ks.length>7)delete all[ks.shift()];store.set(DKEY,all);return all[d]}
const dmy=(d,y)=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+(y?'/'+d.getFullYear():'');
function renderHome(){
  const s=stats(),dd=daily()[TODAY];
  const dl=dd?(dd.done?'Hoy: racha '+(dd.streak||0)+' · vuelve mañana':'Hoy lo dejaste a medias · vuelve mañana'):'';
  $('modesBox').innerHTML=`<button class="mode gold day${dd?' done':''}" id="bDaily"><b>📅 Reto diario</b><span>Los mismos jugadores para todo el mundo. Un solo intento al día.${dl?'<br>'+dl:''}</span></button>`+
    CATS.map(c=>`<button class="mode" data-cat="${c.k}"><b>▶ ${c.n}</b><span>${c.d}.<br>Récord: ${s.bestByCat[c.k]||0}</span></button>`).join('');
  $('bDaily').onclick=startDaily;
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>start(b.dataset.cat));
  $('homeStats').innerHTML=`<div class="stat"><b>${s.best}</b><span>Mejor racha</span></div><div class="stat"><b>${s.games}</b><span>Partidas</span></div><div class="stat"><b>${s.total}</b><span>Aciertos</span></div>`;
  renderRank();syncBest();
}
function startDaily(){
  const dd=daily()[TODAY];
  if(dd){toast(dd.done?'Hoy: racha '+(dd.streak||0)+' · vuelve mañana':'Hoy lo dejaste a medias · vuelve mañana');return}
  start('carrera',true);
}
function start(k,isDaily){
  tStop();clearTimeout(flowT);
  mode=isDaily?'daily':'free';cat=isDaily?CATS[0]:(CATS.find(c=>c.k===k)||CATS[0]);
  rnd=isDaily?seeded('hl-'+TODAY):Math.random;
  if(isDaily)setDaily(TODAY,{start:1});
  pool=P.filter(p=>typeof p[cat.k]==='number'&&p[cat.k]>=cat.min);
  streak=0;round=0;results=[];used=new Set();
  const fam=pool.filter(p=>FAMOUS.has(p.name));const st=fam.length?fam:pool;
  A=st[Math.floor(rnd()*st.length)];used.add(A.name);
  B=pickB(A,pool,used,rnd);used.add(B.name);
  document.body.classList.add('playing');
  $('home').hidden=true;$('res').hidden=true;$('game').hidden=false;
  $('cat').textContent=isDaily?'Reto diario':'Goles · '+cat.n;$('rec').textContent=isDaily?(stats().bestDaily||0):(stats().bestByCat[cat.k]||0);
  render(false);
}
// Tras acertar, el de la derecha pasa a la izquierda y sale uno nuevo.
function next(){
  let nb=pickB(B,pool,used,rnd);
  if(!nb){used=new Set([B.name]);nb=pickB(B,pool,used,rnd)}
  A=B;B=nb;used.add(B.name);
  render(true);
}
function fill(el,p){
  el.querySelector('.flag').textContent=p.flag;el.querySelector('.nm').textContent=p.name;el.querySelector('.pn').textContent=POS_NAME[p.pos]||'';
}
function render(anim){
  const cA=$('cA'),cB=$('cB');
  fill(cA,A);fill(cB,B);
  cA.querySelector('.led').textContent=fmt(A[cat.k]);
  const v=cB.querySelector('.led');v.className='led q';v.textContent='???';
  cA.className='side';cB.className='side';
  if(anim){void cA.offsetWidth;cA.classList.add('inA');cB.classList.add('inB')}
  $('choice').hidden=false;
  $('fb').textContent='';$('fb').className='fb2';
  $('streak').textContent=streak;
  // los botones se activan (y arranca el reloj) cuando termina la animación de entrada
  busy=true;tShow(LIMIT);
  flowT=setTimeout(()=>{busy=false;tStart()},anim?450:0);
}
// ---- reloj: 10 s por respuesta, con hora límite (no se para aunque cambies de pestaña) ----
let tEnd=0,tTO=0,tRAF=0;
const tLeft=()=>tEnd-performance.now();
function tShow(ms){const low=ms<=3000;$('tBar').style.transform='scaleX('+Math.max(0,ms/LIMIT)+')';$('tBar').classList.toggle('low',low);const t=$('tSec');t.className='t'+(low?' low':'');t.textContent=Math.max(0,Math.ceil(ms/1000));}
function tStart(){tStop();tEnd=performance.now()+LIMIT;tTO=setTimeout(()=>{if(tEnd)timeUp()},LIMIT);tDraw();}
function tDraw(){tRAF=0;if(!tEnd)return;const l=tLeft();if(l<=0){timeUp();return}tShow(l);tRAF=requestAnimationFrame(tDraw);}
function tStop(){clearTimeout(tTO);if(tRAF)cancelAnimationFrame(tRAF);tEnd=0;tTO=tRAF=0;}
function tReset(){tStop();$('tBar').style.transform='';$('tBar').classList.remove('low');$('tSec').className='';$('tSec').textContent='VS';}
document.addEventListener('visibilitychange',()=>{if(tEnd&&tLeft()<=0)timeUp()});
function timeUp(){if(busy||!tEnd)return;tShow(0);reveal(false,true);}
function answer(more){
  if(busy)return;
  if(tEnd&&tLeft()<=0){timeUp();return}
  reveal(more?B[cat.k]>A[cat.k]:B[cat.k]<A[cat.k],false);
}
function reveal(ok,late){
  busy=true;if(late)tStop();else tReset();
  $('choice').hidden=true;
  const v=$('cB').querySelector('.led');v.className='led';countUp(v,B[cat.k],700);
  $('cB').className='side '+(ok?'ok':'ko');
  results.push(ok);round++;
  if(ok){streak++;$('streak').textContent=streak;flowT=setTimeout(next,1300);return}
  $('fb').className='fb2 bad';$('fb').textContent='';
  $('fb').append(late?'⏱️ Se acabó el tiempo. ':'',`${B.name} tiene ${fmt(B[cat.k])} y ${A.name} ${fmt(A[cat.k])}.`);
  flowT=setTimeout(finish,late?2600:2000);
}
function finish(){
  tReset();clearTimeout(flowT);
  const s=stats(),isDaily=mode==='daily';s.games++;s.total+=streak;s.best=Math.max(s.best,streak);
  const prevBest=s.bestByCat[cat.k]||0,record=!isDaily&&streak>0&&streak>prevBest;
  if(isDaily){s.bestDaily=Math.max(s.bestDaily||0,streak);setDaily(TODAY,{done:1,streak})}else s.bestByCat[cat.k]=Math.max(prevBest,streak);
  store.set(SKEY,s);
  const big=streak,unit=streak===1?'acierto seguido':'aciertos seguidos';
  const sm=isDaily?unit+' · mañana hay otro reto':unit+(record?' · ¡nuevo récord!':' · récord: '+s.bestByCat[cat.k]);
  const url=location.origin+location.pathname;
  const text=isDaily?`GOALDAY ⚽ Higher or Lower · Reto diario ${dmy(today)}\n🔥 Racha de ${streak}\n${url}`:`GOALDAY ⚽ Higher or Lower · ${cat.t}\n🔥 Racha de ${streak}\n${url}`;
  document.body.classList.remove('playing');$('game').hidden=true;$('res').hidden=false;
  $('res').innerHTML=`<div class="lbl">${isDaily?'Reto diario · '+dmy(today,1):cat.t}</div><div class="big">${big}</div><div class="sm">${sm}</div><div id="rankMsg" class="sm"></div><div class="row" style="justify-content:center"><button class="btn" id="bShare">Compartir</button>${isDaily?'<button class="btn ghost" id="bHome">Volver</button>':'<button class="btn ghost" id="bAgain">Otra vez</button><button class="btn ghost" id="bHome">Inicio</button>'}<span class="muted" id="shareOk"></span></div>`;
  $('bShare').onclick=()=>share(text,$('shareOk'));
  if(!isDaily)$('bAgain').onclick=()=>start(cat.k);
  $('bHome').onclick=goHome;
  const rm=$('rankMsg'),k=cat.k;
  if(isDaily)sendDaily(TODAY,rm);
  else if(record){if(me().pid&&me().name)saveBest(k,rm);else nameLine(k,rm)}
}
function goHome(){tReset();clearTimeout(flowT);document.body.classList.remove('playing');$('game').hidden=true;$('res').hidden=true;$('home').hidden=false;renderHome()}
$('bMore').onclick=()=>answer(true);$('bLess').onclick=()=>answer(false);

// ---- ranking mundial (Supabase, mismo proyecto y mismo nombre que el resto de juegos de GOALDAY) ----
const SB_URL='https://mvcvqzbosnwkhnlfvsuf.supabase.co';
const SB_KEY='sb_publishable_2l-zuNvtSO2SoiPfPDaOow_V1yl8zp0';
const SB_H={'apikey':SB_KEY,'Content-Type':'application/json'};
const RKEY='reto15k-v2';
const me=()=>{try{return JSON.parse(localStorage.getItem(RKEY))||{}}catch(e){return {}}};
function saveMe(pid,name){const o=me();o.pid=pid;o.name=name;try{localStorage.setItem(RKEY,JSON.stringify(o))}catch(e){}}
function newId(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)})}
async function sbRpc(fn,args){const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:SB_H,body:JSON.stringify(args)});if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}}
// 409 = ya estaba guardado (un solo resultado por jugador y día en el reto diario)
async function postScore(o){const u=me();if(!u.pid||!u.name)return false;
  const r=await fetch(SB_URL+'/rest/v1/hl_scores',{method:'POST',headers:Object.assign({'Prefer':'return=minimal'},SB_H),body:JSON.stringify(Object.assign({player_id:u.pid,name:u.name},o))});
  if(r.status===409)return true;
  if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;try{e.body=await r.text()}catch(x){}throw e}return true}
function errMsg(e){const b=(e.body||'');
  return (e.status===404||/42P01|does not exist|schema cache/i.test(b))?'No se ha podido guardar: falta crear la tabla del ranking en Supabase.'
    :(e.status===401||e.status===403||/42501|permission|policy/i.test(b))?'No se ha podido guardar: la tabla del ranking no tiene permisos.'
    :'No se ha podido guardar en el ranking ('+(e.status||'sin conexión')+').';}
const savedMsg=()=>'🌍 Guardado en el ranking mundial como '+me().name;
async function sendDaily(d,rm){
  const x=daily()[d];if(!x||!x.done)return;
  if(x.sent){if(rm)rm.textContent=savedMsg();return}
  if(!me().pid||!me().name){if(rm)askName(rm,()=>sendDaily(d,rm));return}
  if(sendDaily.busy)return;sendDaily.busy=1;
  if(rm)rm.textContent='Guardando en el ranking mundial…';
  try{await postScore({mode:'diario',day:d,streak:x.streak||0});setDaily(d,{sent:1});if(rm)rm.textContent=savedMsg();renderRank()}
  catch(e){if(rm)rm.textContent=errMsg(e)}
  finally{sendDaily.busy=0}
}
// Récords de las partidas libres: se sube el mejor de cada categoría que aún no esté en el ranking.
// En cola, para no subir dos veces el mismo récord; se relee stats() tras el await (una partida puede haber guardado algo).
let syncQ=Promise.resolve({done:{},errs:{}});
async function doSync(){
  const u=me(),s=stats(),done={},errs={};
  const pend=CATS.filter(c=>(s.bestByCat[c.k]||0)>(s.sent[c.k]||0));
  if(!pend.length||!u.pid||!u.name)return {done,errs};
  for(const c of pend){const v=s.bestByCat[c.k];try{await postScore({mode:c.k,streak:v});done[c.k]=v}catch(e){errs[c.k]=e}}
  if(Object.keys(done).length){const s2=stats();for(const k in done)s2.sent[k]=Math.max(s2.sent[k]||0,done[k]);store.set(SKEY,s2);renderRank()}
  return {done,errs};
}
const syncBest=()=>(syncQ=syncQ.then(doSync,doSync));
function saveBest(k,rm){rm.textContent='Guardando en el ranking mundial…';syncBest().then(r=>{rm.textContent=r.errs[k]?errMsg(r.errs[k]):savedMsg()})}
function nameLine(k,rm){
  rm.innerHTML='<div>Elige tu nombre para salir en el ranking</div><button class="btn small ghost" id="bName" style="margin-top:8px">Elegir nombre</button>';
  rm.querySelector('#bName').onclick=()=>askName(rm,()=>saveBest(k,rm));
}
function askName(rm,then){
  rm.innerHTML=`Elige tu nombre para salir en el ranking mundial:<div class="namebox"><input id="nmIn" maxlength="16" placeholder="Tu nombre"><button class="btn small" id="nmOk">Guardar</button></div><div id="nmErr" class="sm"></div>`;
  const inp=rm.querySelector('#nmIn'),ok=rm.querySelector('#nmOk'),er=rm.querySelector('#nmErr');
  inp.onkeydown=e=>{if(e.key==='Enter')ok.click()};setTimeout(()=>inp.focus(),50);
  ok.onclick=async()=>{
    const n=(inp.value||'').replace(/\s+/g,' ').trim().slice(0,16);
    if(n.length<2){er.textContent='Mínimo 2 caracteres.';return}
    ok.disabled=true;
    try{const pid=newId();await sbRpc('register_name',{pid,n});saveMe(pid,n);then()}
    catch(e){ok.disabled=false;er.textContent=e.status===409?'Ese nombre ya lo tiene otro jugador. Elige otro.':'No se ha podido guardar. Revisa la conexión.'}
  };
}
const RTABS=[{k:'diario',n:'Hoy'}].concat(CATS.map(c=>({k:c.k,n:c.n})));
let rankTab='diario',rankReq=0;
async function renderRank(){
  $('rTabs').innerHTML=RTABS.map(t=>`<button data-r="${t.k}" class="${t.k===rankTab?'on':''}">${t.n}</button>`).join('');
  $('rTabs').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rankTab=b.dataset.r;renderRank()});
  const ul=$('rankList'),tok=++rankReq;ul.innerHTML='<p class="muted">Cargando…</p>';
  try{
    const q=rankTab==='diario'?'mode=eq.diario&day=eq.'+TODAY+'&order=streak.desc&limit=100':'mode=eq.'+rankTab+'&order=streak.desc&limit=500';
    const r=await fetch(SB_URL+'/rest/v1/hl_scores?select=name,streak&'+q,{headers:SB_H});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const rows=await r.json();if(tok!==rankReq)return;
    // un nombre por fila, con su mejor racha
    const best={};rows.forEach(x=>{if(!(x.name in best)||x.streak>best[x.name])best[x.name]=x.streak});
    const list=Object.entries(best).sort((a,b)=>b[1]-a[1]),my=me().name;
    if(!list.length){ul.innerHTML='<p class="muted">Todavía no hay nadie. ¡Sé el primero!</p>';return}
    const row=([n,v],i)=>`<div class="rrow${n===my?' me':''}"><span class="n">${i+1}</span><span>${esc(n)}</span><span class="c">${fmt(v)}</span></div>`;
    const pos=my?list.findIndex(([n])=>n===my):-1;
    ul.innerHTML=list.slice(0,10).map(row).join('')+(pos>=10?row(list[pos],pos):'');
  }catch(e){if(tok===rankReq)ul.innerHTML='<p class="muted">Ranking no disponible ahora mismo.</p>'}
}
renderHome();
// si el reto diario (de hoy o de ayer) no llegó al ranking (sin conexión), se reintenta
{const y=new Date(today);y.setDate(y.getDate()-1);[dayKey(y),TODAY].forEach(d=>{const x=daily()[d];if(x&&x.done&&!x.sent&&me().pid&&me().name)sendDaily(d)})}
</script>
