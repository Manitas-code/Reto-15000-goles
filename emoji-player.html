<script>/* fondo del estadio al instante */try{var fgc=JSON.parse(localStorage.getItem('fg_bg')),fgt=localStorage.getItem('fg_team');if(fgc&&fgc.url&&fgt&&fgt!=='none'&&fgc.t===fgt){document.documentElement.classList.add('fgbg');var fgs=document.createElement('style');fgs.textContent='html.fgbg{background:#050912}html.fgbg::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:#050912 url("'+fgc.url+'") center top/cover no-repeat}html.fgbg body{background:transparent!important}';document.head.appendChild(fgs)}}catch(e){}</script>
